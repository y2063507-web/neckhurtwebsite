<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pnig - Instant Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { darkbg: '#0f1115', panel: '#181b22', accent: '#00f0ff' } } } }
    </script>
</head>
<body class="bg-darkbg text-gray-200 font-sans h-screen flex flex-col overflow-hidden relative">

    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-panel border border-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md text-center">
            <h1 class="text-3xl font-extrabold tracking-wider text-accent mb-2">pnig</h1>
            <p class="text-sm text-gray-400 mb-6">Zero friction. No passwords. Pure chat.</p>
            
            <div class="mb-6 text-left">
                <label class="text-xs uppercase font-semibold text-gray-500 mb-2 block">1. Enter Codename</label>
                <div class="flex gap-2">
                    <input id="username-input" type="text" placeholder="Your username..." class="flex-1 bg-darkbg border border-gray-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-accent text-gray-200">
                    <button id="create-btn" class="bg-accent text-darkbg font-bold px-5 py-2 rounded-lg text-sm hover:opacity-95 transition">Join</button>
                </div>
            </div>

            <div class="relative flex py-2 items-center mb-6">
                <div class="flex-grow border-t border-gray-800"></div>
                <span class="flex-shrink mx-4 text-xs text-gray-600 uppercase">Or Import</span>
                <div class="flex-grow border-t border-gray-800"></div>
            </div>

            <div class="text-left">
                <label class="text-xs uppercase font-semibold text-gray-500 mb-2 block">2. Restore Session Backup</label>
                <input type="file" id="import-file" accept=".json" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-gray-800 file:text-accent hover:file:bg-gray-700 cursor-pointer mb-2">
                <button id="import-btn" class="w-full bg-gray-800 border border-gray-700 text-gray-300 font-semibold py-2 rounded-lg text-sm hover:bg-gray-700 transition">Restore & Enter</button>
            </div>
        </div>
    </div>

    <!-- CHAT SCREEN -->
    <div id="chat-screen" class="hidden flex-1 flex h-screen overflow-hidden">
        
        <!-- SERVER SIDEBAR -->
        <aside class="w-16 bg-[#111318] border-r border-gray-800 flex flex-col items-center py-4 gap-4">
            <button onclick="switchServer('general', 'General Lobby')" class="w-12 h-12 rounded-2xl bg-panel hover:bg-accent hover:text-darkbg flex items-center justify-center font-bold transition text-accent shadow" title="General Lobby">
                pn
            </button>
            <div class="w-8 h-[2px] bg-gray-800 rounded"></div>
            
            <div id="server-list" class="flex flex-col gap-3 flex-1 overflow-y-auto w-full items-center"></div>

            <button onclick="openServerModal()" class="w-12 h-12 rounded-full bg-panel hover:bg-green-500 hover:text-darkbg flex items-center justify-center font-bold text-xl transition text-green-400 shadow" title="Create Server">
                +
            </button>
        </aside>

        <!-- CHANNEL PANE -->
        <div class="w-60 bg-panel border-r border-gray-800 flex flex-col">
            <div class="p-4 border-b border-gray-800 font-bold text-accent text-sm flex justify-between items-center">
                <div class="flex items-center gap-1.5 truncate">
                    <span id="current-server-title" class="truncate">General Lobby</span>
                    <button id="edit-server-btn" onclick="openEditServerModal()" class="hidden text-xs text-gray-400 hover:text-white px-1.5 py-0.5 rounded bg-gray-800 border border-gray-700" title="Customize Server">⚙️</button>
                </div>
                <button onclick="exportSession()" class="text-xs text-gray-400 hover:text-white px-2 py-1 rounded bg-gray-800 border border-gray-700" title="Export Backup">💾 Backup</button>
            </div>
            
            <div class="p-3 flex-1 overflow-y-auto space-y-1">
                <div class="flex justify-between items-center px-2 mb-2">
                    <span class="text-xs font-semibold text-gray-500 uppercase">Channels</span>
                    <button id="add-channel-btn" onclick="openChannelModal()" class="hidden text-xs text-gray-400 hover:text-white font-bold px-1.5 py-0.5 rounded bg-gray-800 border border-gray-700" title="Create Channel">+</button>
                </div>
                <div id="channel-list" class="space-y-1"></div>
            </div>

            <div class="p-3 border-t border-gray-800 text-xs text-gray-400 truncate flex items-center justify-between">
                <span id="user-display-tag" class="font-semibold text-gray-300"></span>
                <button onclick="logout()" class="text-red-400 hover:underline">Logout</button>
            </div>
        </div>

        <!-- CHAT MAIN -->
        <div class="flex-1 flex flex-col bg-darkbg relative">
            <header class="bg-panel border-b border-gray-800 px-6 py-4 flex justify-between items-center">
                <h2 id="current-channel-title" class="font-bold text-gray-200 text-sm tracking-wide"># main</h2>
                <span class="text-xs text-green-400 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> Connected</span>
            </header>
            
            <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-3"></div>

            <!-- STICKER & EMOJI POPUP DRAWER -->
            <div id="sticker-drawer" class="hidden absolute bottom-20 left-4 bg-panel border border-gray-700 rounded-2xl p-4 shadow-2xl w-80 z-50 flex flex-col gap-3">
                <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                    <span class="text-xs font-bold text-accent uppercase tracking-wider">Stickers & Emojis</span>
                    <button onclick="toggleStickerDrawer()" class="text-gray-400 hover:text-white text-sm">✕</button>
                </div>
                
                <div>
                    <span class="text-[10px] text-gray-500 uppercase font-semibold block mb-1">Emojis</span>
                    <div class="grid grid-cols-6 gap-1 text-xl">
                        <button onclick="sendEmoji('🔥')" class="p-1 hover:bg-gray-800 rounded">🔥</button>
                        <button onclick="sendEmoji('💀')" class="p-1 hover:bg-gray-800 rounded">💀</button>
                        <button onclick="sendEmoji('😂')" class="p-1 hover:bg-gray-800 rounded">😂</button>
                        <button onclick="sendEmoji('😎')" class="p-1 hover:bg-gray-800 rounded">😎</button>
                        <button onclick="sendEmoji('🚀')" class="p-1 hover:bg-gray-800 rounded">🚀</button>
                        <button onclick="sendEmoji('👍')" class="p-1 hover:bg-gray-800 rounded">👍</button>
                        <button onclick="sendEmoji('❤️')" class="p-1 hover:bg-gray-800 rounded">❤️</button>
                        <button onclick="sendEmoji('🎉')" class="p-1 hover:bg-gray-800 rounded">🎉</button>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[10px] text-gray-500 uppercase font-semibold">Server Stickers</span>
                        <input type="file" id="sticker-upload-input" accept="image/*" class="hidden">
                        <button id="upload-sticker-btn" onclick="document.getElementById('sticker-upload-input').click()" class="hidden text-[10px] text-accent hover:underline">+ Upload Sticker</button>
                    </div>
                    <div id="server-stickers-grid" class="grid grid-cols-3 gap-2 max-h-36 overflow-y-auto"></div>
                </div>
            </div>

            <!-- DISCORD-STYLE ATTACHMENT PREVIEW BOX -->
            <div id="attachment-preview-box" class="hidden bg-[#13151b] border-t border-gray-800 px-4 py-2 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div id="preview-thumbnail" class="w-12 h-12 bg-gray-800 rounded-lg flex items-center justify-center text-xl overflow-hidden border border-gray-700">📦</div>
                    <div class="flex flex-col">
                        <span id="preview-filename" class="text-xs font-semibold text-gray-200 truncate max-w-xs">filename.ext</span>
                        <span class="text-[10px] text-gray-500">Ready to upload</span>
                    </div>
                </div>
                <button type="button" onclick="clearAttachment()" class="text-gray-400 hover:text-red-400 text-sm bg-gray-800 px-2 py-1 rounded-lg border border-gray-700 transition">✕ Remove</button>
            </div>

            <!-- CHAT INPUT FORM -->
            <form id="chat-form" class="bg-panel border-t border-gray-800 p-4 flex gap-3 items-center">
                <input type="file" id="file-input" class="hidden">
                <button type="button" onclick="toggleStickerDrawer()" class="text-gray-400 hover:text-accent p-2 text-xl transition" title="Stickers & Emojis">🎨</button>
                <button type="button" onclick="document.getElementById('file-input').click()" class="text-gray-400 hover:text-accent p-2 text-xl transition" title="Upload File or Video">📎</button>
                <input id="message-input" type="text" placeholder="Type a message or caption..." autocomplete="off" class="flex-1 bg-darkbg border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-accent text-gray-200">
                <button type="submit" class="bg-accent text-darkbg font-bold px-6 rounded-xl text-sm hover:opacity-90 transition">Send</button>
            </form>
        </div>
    </div>

    <!-- MODALS -->
    <div id="server-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4">
        <div class="bg-panel border border-gray-800 p-6 rounded-2xl w-full max-w-sm">
            <h3 class="font-bold text-lg mb-4 text-gray-100">Create Custom Server</h3>
            <input id="new-server-input" type="text" placeholder="Server Name" class="w-full bg-darkbg border border-gray-700 rounded-lg px-4 py-2 text-sm mb-4 focus:outline-none focus:border-accent text-gray-200">
            <div class="flex justify-end gap-2">
                <button onclick="closeServerModal()" class="px-4 py-2 text-sm text-gray-400 hover:text-gray-200">Cancel</button>
                <button onclick="submitServer()" class="bg-accent text-darkbg font-bold px-4 py-2 rounded-lg text-sm">Create</button>
            </div>
        </div>
    </div>

    <div id="channel-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4">
        <div class="bg-panel border border-gray-800 p-6 rounded-2xl w-full max-w-sm">
            <h3 class="font-bold text-lg mb-4 text-gray-100">Create Channel</h3>
            <input id="new-channel-input" type="text" placeholder="Channel Name" class="w-full bg-darkbg border border-gray-700 rounded-lg px-4 py-2 text-sm mb-4 focus:outline-none focus:border-accent text-gray-200">
            <div class="flex justify-end gap-2">
                <button onclick="closeChannelModal()" class="px-4 py-2 text-sm text-gray-400 hover:text-gray-200">Cancel</button>
                <button onclick="submitChannel()" class="bg-accent text-darkbg font-bold px-4 py-2 rounded-lg text-sm">Create</button>
            </div>
        </div>
    </div>

    <div id="edit-server-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4">
        <div class="bg-panel border border-gray-800 p-6 rounded-2xl w-full max-w-md space-y-4">
            <h3 class="font-bold text-lg text-gray-100">Customize Server</h3>
            <div>
                <label class="text-xs uppercase font-semibold text-gray-500 mb-1 block">Server Name</label>
                <input id="edit-server-input" type="text" placeholder="New Server Name" class="w-full bg-darkbg border border-gray-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-accent text-gray-200">
            </div>
            
            <div id="invite-section">
                <label class="text-xs uppercase font-semibold text-gray-500 mb-1 block">Invite Link</label>
                <div class="flex gap-2">
                    <input id="invite-link-input" type="text" readonly class="flex-1 bg-darkbg border border-gray-700 rounded-lg px-3 py-1.5 text-xs text-gray-400 focus:outline-none">
                    <button onclick="copyInviteLink()" class="bg-gray-800 border border-gray-700 text-gray-300 font-semibold px-3 py-1.5 rounded-lg text-xs hover:bg-gray-700 transition">Copy</button>
                </div>
            </div>

            <div class="flex justify-between items-center pt-2 border-t border-gray-800">
                <button id="delete-server-btn" onclick="confirmDeleteServer()" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500 hover:text-white px-3 py-2 rounded-lg text-xs font-semibold transition">Delete Server</button>
                <div class="flex gap-2 ml-auto">
                    <button onclick="closeEditServerModal()" class="px-4 py-2 text-sm text-gray-400 hover:text-gray-200">Cancel</button>
                    <button onclick="submitEditServer()" class="bg-accent text-darkbg font-bold px-4 py-2 rounded-lg text-sm">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- FRONTEND APP LOGIC -->
    <script>
        const BACKEND_URL = "https://neckhurtwebsite.onrender.com"; 
        const ADMIN_USER_ID = "usr_kbyc5yhe2";

        let socket;
        let currentSession = null;
        let currentServerId = "general";
        let currentChannel = "main";
        let allServers = { "general": { name: "General Lobby", owner: "System", channels: ["main", "random"], stickers: [] } };
        let currentServerStickers = [];
        let currentInviteCode = "";
        let pendingFile = null;

        window.addEventListener("DOMContentLoaded", () => {
            const saved = localStorage.getItem("pnig_session");
            if (saved) {
                currentSession = JSON.parse(saved);
                initChat(currentSession);
            }
        });

        document.getElementById("create-btn").addEventListener("click", () => {
            const username = document.getElementById("username-input").value.trim();
            if (!username) return alert("Enter a username!");

            currentSession = {
                username: username,
                userId: 'usr_' + Math.random().toString(36).substr(2, 9)
            };
            localStorage.setItem("pnig_session", JSON.stringify(currentSession));
            initChat(currentSession);
        });

        document.getElementById("import-btn").addEventListener("click", () => {
            const fileInput = document.getElementById("import-file");
            if (!fileInput.files.length) return alert("Select a backup JSON file.");

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.username && data.userId) {
                        currentSession = data;
                        localStorage.setItem("pnig_session", JSON.stringify(currentSession));
                        initChat(currentSession);
                    } else {
                        alert("Invalid format.");
                    }
                } catch (err) {
                    alert("Could not read backup.");
                }
            };
            reader.readAsText(fileInput.files[0]);
        });

        function initChat(session) {
            document.getElementById("auth-screen").classList.add("hidden");
            document.getElementById("chat-screen").classList.remove("hidden");
            document.getElementById("user-display-tag").innerText = "@" + session.username;

            socket = io(BACKEND_URL);

            socket.on("connect", () => {
                socket.emit("auth_user", session);

                // Handle URL invite code lookup automatically on connection
                const urlParams = new URLSearchParams(window.location.search);
                const inviteCode = urlParams.get("invite");
                if (inviteCode) {
                    socket.emit("join_server_by_invite", inviteCode);
                }
            });

            socket.on("server_list", (servers) => {
                allServers = servers;
                renderServerList();
                renderChannels(allServers[currentServerId]?.channels || ["main"]);
                updateEditButtonVisibility();
            });

            socket.on("server_switched", (data) => {
                currentServerId = data.serverId;
                currentChannel = data.channel;
                currentServerStickers = data.stickers || [];
                currentInviteCode = data.inviteCode || "";
                renderChannels(data.channels);
                renderStickerDrawer(currentServerStickers);
                updateEditButtonVisibility();
            });

            socket.on("force_switch_server", (targetServerId) => {
                switchServer(targetServerId);
            });

            socket.on("channel_switched", (channelName) => {
                currentChannel = channelName;
                document.getElementById("current-channel-title").innerText = "# " + channelName;
                highlightActiveChannel(channelName);
            });

            socket.on("channels_updated", (channels) => {
                if (allServers[currentServerId]) {
                    allServers[currentServerId].channels = channels;
                }
                renderChannels(channels);
            });

            socket.on("stickers_updated", (stickers) => {
                currentServerStickers = stickers;
                renderStickerDrawer(stickers);
            });

            socket.on("server_created_success", (serverId) => {
                closeServerModal();
                switchServer(serverId, allServers[serverId] ? allServers[serverId].name : "Custom Server");
            });

            socket.on("load_history", (history) => {
                const box = document.getElementById("chat-messages");
                box.innerHTML = "";
                history.forEach((msg) => renderMessage(msg));
                box.scrollTop = box.scrollHeight;
            });

            socket.on("message", (msg) => {
                renderMessage(msg);
            });

            socket.on("message_deleted", (msgId) => {
                const el = document.getElementById(`msg-${msgId}`);
                if (el) el.remove();
            });
        }

        function toggleStickerDrawer() {
            document.getElementById("sticker-drawer").classList.toggle("hidden");
        }

        function sendEmoji(emoji) {
            const input = document.getElementById("message-input");
            input.value += emoji;
            input.focus();
            toggleStickerDrawer();
        }

        function sendSticker(url) {
            socket.emit("chat_message", {
                text: "",
                fileUrl: url,
                fileName: "sticker.gif",
                fileType: "image/gif"
            });
            toggleStickerDrawer();
        }

        document.getElementById("file-input").addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 30 * 1024 * 1024) {
                alert("File is too large! Please choose a file under 30MB.");
                e.target.value = "";
                return;
            }

            pendingFile = file;

            const previewBox = document.getElementById("attachment-preview-box");
            const thumbnail = document.getElementById("preview-thumbnail");
            document.getElementById("preview-filename").innerText = file.name;

            const objectUrl = URL.createObjectURL(file);

            if (file.type.startsWith("image/")) {
                thumbnail.innerHTML = `<img src="${objectUrl}" class="w-full h-full object-cover">`;
            } else if (file.type.startsWith("video/")) {
                thumbnail.innerHTML = `🎥`;
            } else {
                thumbnail.innerHTML = `📦`;
            }

            previewBox.classList.remove("hidden");
            document.getElementById("message-input").focus();
            e.target.value = "";
        });

        function clearAttachment() {
            pendingFile = null;
            document.getElementById("attachment-preview-box").classList.add("hidden");
            document.getElementById("file-input").value = "";
        }

        document.getElementById("sticker-upload-input").addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            if (file.size > 2 * 1024 * 1024) {
                alert("Sticker must be under 2MB!");
                e.target.value = "";
                return;
            }

            socket.emit("upload_server_sticker_binary", {
                serverId: currentServerId,
                file: file,
                fileType: file.type
            });

            e.target.value = "";
        });

        function renderStickerDrawer(stickers) {
            const grid = document.getElementById("server-stickers-grid");
            grid.innerHTML = "";
            stickers.forEach(url => {
                const btn = document.createElement("button");
                btn.className = "bg-darkbg border border-gray-800 rounded-lg p-1 hover:border-accent transition";
                btn.innerHTML = `<img src="${url}" class="w-full h-12 object-cover rounded">`;
                btn.onclick = () => sendSticker(url);
                grid.appendChild(btn);
            });
        }

        function renderMessage(msg) {
            const box = document.getElementById("chat-messages");
            const div = document.createElement("div");

            if (msg.system) {
                div.className = "text-center text-xs text-gray-500 my-1 font-mono";
                div.innerText = `— ${msg.text} —`;
            } else {
                div.id = `msg-${msg.id}`;
                div.className = "flex flex-col gap-1 group relative";

                let headerHtml = `<div class="flex items-baseline justify-between"><div class="flex items-baseline gap-2"><span class="font-semibold text-accent text-sm">${msg.username}</span><span class="text-[10px] text-gray-500">${msg.time || ''}</span></div>`;
                
                if (currentSession && msg.username === currentSession.username) {
                    headerHtml += `<button onclick="deleteMessage('${msg.id}')" class="text-xs text-gray-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition px-1" title="Delete message">🗑️</button>`;
                }
                headerHtml += `</div>`;

                let contentHtml = headerHtml;
                if (msg.text) {
                    contentHtml += `<p class="text-sm text-gray-200 mt-0.5">${escapeHtml(msg.text)}</p>`;
                }
                
                if (msg.fileUrl) {
                    const fType = msg.fileType || "";
                    if (fType.startsWith("image/")) {
                        contentHtml += `<div class="mt-2 max-w-[220px] rounded-xl overflow-hidden bg-transparent"><img src="${msg.fileUrl}" alt="media" class="w-full h-auto object-cover cursor-pointer" onclick="window.open('${msg.fileUrl}', '_blank')"></div>`;
                    } else if (fType.startsWith("video/")) {
                        contentHtml += `<div class="mt-2 max-w-sm rounded-xl overflow-hidden border border-gray-700 bg-darkbg"><video controls class="w-full max-h-64"><source src="${msg.fileUrl}" type="${fType}">Your browser does not support video playback.</video></div>`;
                    } else {
                        contentHtml += `<div class="mt-2 p-3 rounded-xl border border-gray-700 bg-gray-900 flex items-center gap-3 max-w-sm"><span class="text-2xl">📦</span><div class="overflow-hidden"><a href="${msg.fileUrl}" download="${msg.fileName || 'file'}" class="text-xs font-semibold text-accent hover:underline block truncate">${escapeHtml(msg.fileName || 'Download File')}</a><span class="text-[10px] text-gray-400">Attached File</span></div></div>`;
                    }
                }
                div.innerHTML = contentHtml;
            }
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function deleteMessage(msgId) {
            socket.emit("delete_message", msgId);
        }

        document.getElementById("chat-form").addEventListener("submit", (e) => {
            e.preventDefault();
            const input = document.getElementById("message-input");
            const text = input.value.trim();

            if (!text && !pendingFile) return;

            if (pendingFile) {
                socket.emit("upload_file_msg", {
                    text: text,
                    file: pendingFile,
                    fileName: pendingFile.name,
                    fileType: pendingFile.type
                });
                clearAttachment();
            } else {
                socket.emit("chat_message", text);
            }

            input.value = "";
        });

        function renderServerList() {
            const list = document.getElementById("server-list");
            list.innerHTML = "";
            for (const [id, srv] of Object.entries(allServers)) {
                if (id === "general") continue;
                const btn = document.createElement("button");
                btn.className = "w-12 h-12 rounded-2xl bg-panel hover:bg-accent hover:text-darkbg flex items-center justify-center font-bold text-sm text-gray-300 transition shadow";
                btn.innerText = srv.name.substring(0, 2).toUpperCase();
                btn.title = srv.name;
                btn.onclick = () => switchServer(id, srv.name);
                list.appendChild(btn);
            }
        }

        function renderChannels(channels) {
            const list = document.getElementById("channel-list");
            list.innerHTML = "";
            const isGeneralAdmin = (currentServerId === "general" && currentSession?.userId === ADMIN_USER_ID);
            const isCustomOwner = (currentServerId !== "general" && allServers[currentServerId] && allServers[currentServerId].owner === currentSession?.username);

            channels.forEach(ch => {
                const itemDiv = document.createElement("div");
                const isActive = ch === currentChannel;
                itemDiv.className = `w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium transition ${isActive ? 'bg-gray-800 text-accent' : 'text-gray-400 hover:bg-gray-850 hover:text-gray-200'}`;
                
                const btn = document.createElement("button");
                btn.className = "text-left flex-1 truncate";
                btn.innerText = "# " + ch;
                btn.onclick = () => {
                    if (currentChannel !== ch) socket.emit("join_channel", ch);
                };
                itemDiv.appendChild(btn);

                if ((isGeneralAdmin || isCustomOwner) && ch !== "main") {
                    const renameBtn = document.createElement("button");
                    renameBtn.className = "text-xs text-gray-500 hover:text-white ml-2 px-1";
                    renameBtn.innerText = "✏️";
                    renameBtn.title = "Rename Channel";
                    renameBtn.onclick = (e) => {
                        e.stopPropagation();
                        promptRenameChannel(ch);
                    };
                    itemDiv.appendChild(renameBtn);
                }

                list.appendChild(itemDiv);
            });
            document.getElementById("current-channel-title").innerText = "# " + currentChannel;
        }

        function promptRenameChannel(oldName) {
            const newName = prompt(`Rename channel #${oldName} to:`, oldName);
            if (newName && newName.trim() !== "") {
                socket.emit("rename_channel", { oldName: oldName, newName: newName.trim() });
            }
        }

        function highlightActiveChannel(activeCh) {
            renderChannels(allServers[currentServerId]?.channels || [activeCh]);
        }

        function switchServer(id, name = "General Lobby") {
            currentServerId = id;
            document.getElementById("current-server-title").innerText = name;
            socket.emit("join_server", id);
            updateEditButtonVisibility();
        }

        function updateEditButtonVisibility() {
            const editBtn = document.getElementById("edit-server-btn");
            const channelAddBtn = document.getElementById("add-channel-btn");
            const stickerUploadBtn = document.getElementById("upload-sticker-btn");

            const isGeneralAdmin = (currentServerId === "general" && currentSession?.userId === ADMIN_USER_ID);
            const isCustomOwner = (currentServerId !== "general" && allServers[currentServerId] && allServers[currentServerId].owner === currentSession?.username);

            if (isGeneralAdmin || isCustomOwner) {
                editBtn.classList.remove("hidden");
                if (channelAddBtn) channelAddBtn.classList.remove("hidden");
                if (stickerUploadBtn) stickerUploadBtn.classList.remove("hidden");
            } else {
                editBtn.classList.add("hidden");
                if (channelAddBtn) channelAddBtn.classList.add("hidden");
                if (stickerUploadBtn) stickerUploadBtn.classList.add("hidden");
            }
        }

        function copyInviteLink() {
            const inviteLink = `${window.location.origin}${window.location.pathname}?invite=${currentInviteCode}`;
            navigator.clipboard.writeText(inviteLink).then(() => {
                alert("Invite link copied to clipboard!");
            });
        }

        function confirmDeleteServer() {
            const currentSrv = allServers[currentServerId];
            if (!currentSrv) return;
            if (confirm(`Are you sure you want to permanently delete "${currentSrv.name}"? This action cannot be undone.`)) {
                socket.emit("delete_server", currentServerId);
                closeEditServerModal();
            }
        }

        function exportSession() {
            if (!currentSession) return;
            const blob = new Blob([JSON.stringify(currentSession, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `pnig-backup-${currentSession.username}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function logout() {
            localStorage.removeItem("pnig_session");
            window.location.reload();
        }

        function openServerModal() {
            document.getElementById("server-modal").classList.remove("hidden");
            document.getElementById("new-server-input").focus();
        }

        function closeServerModal() {
            document.getElementById("server-modal").classList.add("hidden");
            document.getElementById("new-server-input").value = "";
        }

        function submitServer() {
            const name = document.getElementById("new-server-input").value.trim();
            if (!name) return alert("Enter a server name!");
            socket.emit("create_server", name);
        }

        function openChannelModal() {
            document.getElementById("channel-modal").classList.remove("hidden");
            document.getElementById("new-channel-input").focus();
        }

        function closeChannelModal() {
            document.getElementById("channel-modal").classList.add("hidden");
            document.getElementById("new-channel-input").value = "";
        }

        function submitChannel() {
            const name = document.getElementById("new-channel-input").value.trim();
            if (!name) return;
            socket.emit("create_channel", name);
            closeChannelModal();
        }

        function openEditServerModal() {
            const modal = document.getElementById("edit-server-modal");
            const input = document.getElementById("edit-server-input");
            const inviteInput = document.getElementById("invite-link-input");
            const deleteBtn = document.getElementById("delete-server-btn");

            const srv = allServers[currentServerId];
            if (!srv) return;

            input.value = srv.name;
            inviteInput.value = `${window.location.origin}${window.location.pathname}?invite=${currentInviteCode}`;

            const isGeneralAdmin = (currentServerId === "general" && currentSession?.userId === ADMIN_USER_ID);
            const isCustomOwner = (currentServerId !== "general" && srv.owner === currentSession?.username);

            if (currentServerId !== "general" && (isCustomOwner || isGeneralAdmin)) {
                deleteBtn.classList.remove("hidden");
            } else {
                deleteBtn.classList.add("hidden");
            }

            modal.classList.remove("hidden");
            input.focus();
        }

        function closeEditServerModal() {
            document.getElementById("edit-server-modal").classList.add("hidden");
        }

        function submitEditServer() {
            const newName = document.getElementById("edit-server-input").value.trim();
            if (!newName) return;
            socket.emit("update_server", { serverId: currentServerId, newName: newName });
            closeEditServerModal();
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
